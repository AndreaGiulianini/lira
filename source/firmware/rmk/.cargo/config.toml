[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip nRF52840_xxAA"
linker = "flip-link"

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "info"
KEYBOARD_TOML_PATH =  { value = "keyboard.toml", relative = true }
# Homebrew arm-none-eabi-gcc ships without newlib: the C part of the BLE crypto (p256-cortex-m4) only needs
# the compiler's own freestanding headers.
CFLAGS_thumbv7em_none_eabihf = "-ffreestanding"
C_INCLUDE_PATH = { value = "c-shim", relative = true }
