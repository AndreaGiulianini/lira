[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# `cargo run --release` flashes and starts the firmware through an SWD probe; without a probe drag lira.uf2 onto the
# RPI-RP2 drive instead (README.md)
runner = "probe-rs run --chip RP2040"
linker = "flip-link"

[build]
target = "thumbv6m-none-eabi" # Cortex-M0+

[env]
DEFMT_LOG = "info"
KEYBOARD_TOML_PATH =  { value = "keyboard.toml", relative = true }
