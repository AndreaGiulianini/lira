[package]
name = "lira"
version = "0.2.0"
authors = ["Andrea Giulianini"]
description = "Firmware of the Lira keyboard (wired, RP2040), built on RMK"
readme = "README.md"
edition = "2021"
license = "MIT"

# RP2040 (USB only), set up as RMK 0.9's examples/use_config/rp2040
[dependencies]
# async_matrix: with no key held, the matrix waits for a key on the rows' interrupts instead of scanning, and the
# RP2040 sleeps between events (lower current, in USB suspend too)
rmk = { version = "0.9", features = ["rp2040", "async_matrix"] }
embassy-time = { version = "0.5", features = ["defmt"] }
# boot2-w25q080: the second-stage bootloader for the Winbond W25Q flash family (here a W25Q128JV), as on the Pico
embassy-rp = { version = "0.10", features = [
    "rp2040",
    "boot2-w25q080",
    "defmt",
    "time-driver",
    "critical-section-impl",
] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
cortex-m-rt = "0.7.5"
# the Cortex-M0+ has no atomic compare-and-swap: emulated with critical sections
portable-atomic = { version = "1", features = ["critical-section"] }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

# RMK 0.9.0 with this board's two changes (matrix settle time, USB power): made by ../patch_rmk.py (`make firmware`)
[patch.crates-io]
rmk = { path = "../rmk-patched" }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"

[[bin]]
name = "lira"
test = false
bench = false

[profile.dev]
codegen-units = 1
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1
debug = true
opt-level = "z"
overflow-checks = false
lto = "fat"
